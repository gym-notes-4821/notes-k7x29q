<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Notes</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Notes">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app"></main>
<div id="rest" class="rest" hidden role="timer" aria-live="polite">
  <div class="rest-bar"><div class="rest-fill"></div></div>
  <div class="rest-row">
    <button data-rest="-15" aria-label="15 Sekunden weniger">−15</button>
    <div class="rest-mid"><span class="rest-label">Pause</span><b class="rest-time">0:00</b><span class="rest-next"></span></div>
    <button data-rest="15" aria-label="15 Sekunden mehr">+15</button>
  </div>
  <div class="rest-row rest-row2">
    <button data-rest="sound" class="rest-sound" aria-label="Ton an oder aus"></button>
    <button data-rest="stop" class="rest-stop">Pause beenden</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
